# API development: docker compose up --build
# Settings come from .env in this folder. API: http://localhost:4000/api/v1 · pgAdmin: http://localhost:8080
services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 30

    # Runs the migrations and default data, then starts the API with nodemon
    api:
        build:
            context: .
            dockerfile: Dockerfile.dev
        command: sh -c "yarn db:migrate && yarn db:seed && yarn dev"
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        env_file: .env
        environment:
            # Inside Docker the database is the db service
            POSTGRES_HOST: db
            POSTGRES_PORT: 5432
            # File events from macOS do not always reach Docker, so the watcher also checks for changes itself
            CHOKIDAR_USEPOLLING: "true"
        ports:
            - "4000:4000"
        # The code folder is linked into the container; node_modules stay inside it (Linux builds)
        volumes:
            - .:/server
            - /server/node_modules

    # Database browser. Add a server with host "db" and the POSTGRES_* values from .env
    pgadmin:
        image: dpage/pgadmin4:8
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@example.com
            PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
            PGADMIN_CONFIG_SERVER_MODE: "False"
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
        ports:
            - "8080:80"

volumes:
    db-data:
        name: pos-dev-data
