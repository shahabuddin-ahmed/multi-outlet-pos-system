# API production: docker compose -f docker-compose.prod.yml up --build -d
# Settings come from .env in this folder.
services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apps/api/.env}
            POSTGRES_DB: ${POSTGRES_DB}
        # No port on the host: only the API reaches the database
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 30

    # Runs the migrations and default data, then starts the API
    api:
        build:
            context: .
            args:
                PORT: 4000
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        env_file: .env
        environment:
            NODE_ENV: production
            APPLICATION_SERVER_PORT: 4000
            # Inside Docker the database is the db service
            POSTGRES_HOST: db
            POSTGRES_PORT: 5432
        ports:
            - "4000:4000"
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 20s

volumes:
    db-data:
        name: pos-prod-data
