# Web development: docker compose up --build (or the root docker-compose.yml for the whole app)
# Works on a fresh clone: settings come from .env.example, and from .env in this folder when it exists.
# Web: http://localhost:3000
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # Later files win
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      # Demo accounts on the login page in development, unless .env or the shell says otherwise (empty: off)
      NEXT_PUBLIC_DEMO_PASSWORD: ${NEXT_PUBLIC_DEMO_PASSWORD-demo-pos-2026}
      # File events from macOS do not always reach Docker, so Next.js also checks for changes itself
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    # The code folder is linked into the container; node_modules and .next stay inside it
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
